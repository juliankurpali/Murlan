name: Hosting

on:
  workflow_dispatch:
    inputs:
      action:
        description: stop = take it down, start = bring it back
        required: true
        type: choice
        options:
          - stop
          - start
          - status
      what:
        description: server = Render, database = Neon (does not delete players), both = server then database
        required: true
        type: choice
        default: both
        options:
          - both
          - server
          - database

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ENDPOINT_ID: ${{ secrets.NEON_ENDPOINT_ID }}
        run: node scripts/hosting.mjs "${{ inputs.action }}" "${{ inputs.what }}"
