name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Check server address
        run: |
          if [ -z "${{ vars.RELAY_URL }}" ]; then
            echo "Set the RELAY_URL repository variable (Settings > Secrets and variables > Actions > Variables), e.g. wss://murlan-server.onrender.com"
            exit 1
          fi
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL }}
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Add Content-Security-Policy
        run: node scripts/harden-web.mjs dist
        env:
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
